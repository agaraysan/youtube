name: brain-render
# 頭の体操・雑学シリーズの試作。brain/episodes/*.json を push すると声つきで描画し、
# brain-previews 枝に最新分だけ置く（履歴は持たない。投稿はしない）。
on:
  push:
    paths: ["brain/episodes/*.json", "scripts/brain/**", ".github/workflows/brain-render.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: brain-render, cancel-in-progress: false }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-color-emoji && pip install -q pillow numpy
      - name: Fetch brain-previews
        run: |
          mkdir -p pv/out
          if git fetch -q origin brain-previews; then git --work-tree=pv checkout FETCH_HEAD -- out 2>/dev/null || true; fi
      - name: Render new or changed episodes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # 3本ずつ並べて作る
          ls brain/episodes/*.json | xargs -P 3 -n 1 bash scripts/brain/render_one.sh
          # もう台本がない動画は消す
          for m in pv/out/*.mp4; do id=$(basename "$m" .mp4); [ -f "brain/episodes/$id.json" ] || rm -f pv/out/$id.*  pv/out/${id}_sheet.jpg; done
          ls -la pv/out
      - name: Push brain-previews (latest only)
        run: |
          cd pv
          git init -q && git checkout -q -b brain-previews
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add -A out && git commit -qm "brain previews (latest only)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:brain-previews
