name: codex-image
on:
  push:
    paths: ["requests/images/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: codex-image
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Codex CLI
        run: npm install -g @openai/codex && pip install -q pillow
      # Codex は ChatGPT のログイン（PCの ~/.codex/auth.json）で動かす。APIキーは音声専用なので使わない。
      - name: Sign in to Codex (ChatGPT login)
        env: { CODEX_AUTH_JSON: "${{ secrets.CODEX_AUTH_JSON }}" }
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then echo "CODEX_AUTH_JSON がまだありません"; echo "SKIP=1" >> $GITHUB_ENV; exit 0; fi
          mkdir -p ~/.codex && printenv CODEX_AUTH_JSON > ~/.codex/auth.json && chmod 600 ~/.codex/auth.json
      - name: Generate
        if: env.SKIP != '1'
        run: python3 scripts/codex_image.py
      - name: Save results
        if: always() && env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          git diff --cached --quiet || git commit -m "Add generated images from Codex"
          # 同じ枝に別の push が重なっても絵を失わないよう、数回やり直す
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((i * 7)); done
