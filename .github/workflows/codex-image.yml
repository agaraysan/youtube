name: codex-image
on:
  push:
    paths: ["requests/images/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: codex-image
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Codex CLI
        run: npm install -g @openai/codex && pip install -q pillow
      # Codex は ChatGPT のログイン（PCの ~/.codex/auth.json）で動かす。APIキーは音声専用なので使わない。
      - name: Sign in to Codex (ChatGPT login, shared key)
        # 鍵は codex-auth ブランチに暗号化して共有する（scripts/codex_auth.py の説明を参照）。Secret の写しをそのまま使うと、どれかが更新した時点でほかが全部はじかれる。
        env: { CODEX_AUTH_JSON: "${{ secrets.CODEX_AUTH_JSON }}", CODEX_AUTH_KEY: "${{ secrets.OPENAI_API_KEY }}" }
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then echo "CODEX_AUTH_JSON がまだありません"; echo "SKIP=1" >> $GITHUB_ENV; exit 0; fi
          python3 scripts/codex_auth.py load
          python3 scripts/codex_auth.py refresh
      - name: Generate
        if: env.SKIP != '1'
        run: python3 scripts/codex_image.py
      - name: Save results
        if: always() && env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          git diff --cached --quiet || git commit -m "Add generated images from Codex"
          git pull --rebase -q && git push
      - name: Save the Codex key back
        if: always() && env.SKIP != '1'
        env: { CODEX_AUTH_KEY: "${{ secrets.OPENAI_API_KEY }}" }
        run: python3 scripts/codex_auth.py save
