name: explainer-voice
# AI解説動画の試作用。explainer/*.json を push すると、場面ごとの声を作って同じ枝にコミットする。
on:
  push:
    paths: ["explainer/*.json", "scripts/explainer/voices.py", ".github/workflows/explainer-voice.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: explainer-voice
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Narrate with nova
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/explainer/voices.py
      - name: Save voices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add explainer/voice
          git diff --cached --quiet || { git commit -m "explainer: add narration"; for i in 1 2 3 4 5 6; do git pull --rebase -q && git push && break; sleep $((i*5)); done; }
