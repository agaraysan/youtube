name: render
# episodes/*.json を push すると動画を作り、previews 枝の out/<id>.mp4 に置く（投稿はしない）。
on:
  push:
    branches: [main]
    paths: ["episodes/*.json", "scripts/render/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: render, cancel-in-progress: false }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra && pip install -q pillow numpy
      - name: Fetch previews branch
        run: |
          git fetch origin previews:previews 2>/dev/null || true
          git worktree add pv previews 2>/dev/null || { git worktree add --detach pv && cd pv && git checkout --orphan previews && git rm -rfq . ; }
      - name: Render new or changed episodes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p pv/out
          # 台本（episodes/<id>.json）が変わった回だけ作り直す。描画プログラムを直しただけでは作り直さない
          # （作り直したい回は、台本に "rev" を足して変える）。
          for f in episodes/*.json; do
            id=$(basename "$f" .json)
            h=$(sha1sum "$f" | cut -c1-12)
            if [ -f "pv/out/$id.mp4" ] && { [ ! -f "pv/out/$id.src" ] || [ "$(cat pv/out/$id.src)" = "$h" ]; }; then
              echo "$h" > "pv/out/$id.src"; rm -f "pv/out/$id.hash"; echo "skip $id"; continue
            fi
            python3 scripts/render/render.py "$f" pv/out && echo "$h" > "pv/out/$id.src" && rm -f "pv/out/$id.hash"
          done
      - name: Push previews
        run: |
          cd pv
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          # 容量をためないよう、previews 枝は履歴を持たず、いつも最新の1回分だけにする
          git checkout -q --orphan latest
          git add -A out
          git commit -qm "render previews (latest only)"
          git push -q -f origin HEAD:previews
