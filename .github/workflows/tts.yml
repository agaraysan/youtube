name: tts
on:
  push:
    paths: ["requests/tts/*.txt"]
  workflow_dispatch:
    inputs:
      text:
        description: 読み上げる文章
        default: "こんにちは。今日もマッチ棒クイズに挑戦してみましょう。一本だけ動かして、正しい式にしてください。"
jobs:
  speak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Narrate with nova
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TEXT: ${{ inputs.text }}
        run: |
          mkdir -p out
          if [ "${{ github.event_name }}" = push ]; then
            for f in requests/tts/*.txt; do n=$(basename "$f" .txt); python3 scripts/tts.py "out/$n.wav" "$(cat "$f")"; done
          else
            python3 scripts/tts.py out/narration.wav "$TEXT"
          fi
          for f in out/*.wav; do echo "$f $(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")"; done
      - uses: actions/upload-artifact@v4
        with: { name: narration, path: out/*.wav }
